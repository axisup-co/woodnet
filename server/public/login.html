<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WoodNet</title>
<style>
:root{--bg:#0f1720;--panel:#17202b;--panel2:#1e2937;--text:#e6edf5;--muted:#8b98a8;--accent:#3b82f6;--border:#263341}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,Tahoma,sans-serif}
a{color:var(--accent);text-decoration:none}.hidden{display:none!important}
.muted{color:var(--muted)}.small{font-size:12px}.center{text-align:center;padding:20px}
.err{background:#4a1f24;color:#ffb4b4;padding:8px 12px;border-radius:6px;margin:8px 0}
nav{display:flex;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:5;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;margin-left:6px}
nav button,.btn{background:transparent;color:var(--text);border:1px solid var(--border);padding:5px 9px;border-radius:7px;cursor:pointer;font:inherit;font-size:13px}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-p{background:var(--accent);color:#fff;border:none;padding:7px 13px;border-radius:7px;cursor:pointer;font:inherit}
main{max-width:720px;margin:14px auto;padding:0 10px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:8px 10px;font:inherit;margin:4px 0;outline:none}
input:focus,textarea:focus{border-color:var(--accent)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}
.post-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;flex-wrap:wrap}
.post-body{white-space:pre-wrap;margin:6px 0}.post-media{max-width:100%;border-radius:7px;margin:6px 0}
.post-actions{display:flex;gap:6px;padding-top:6px;border-top:1px solid var(--border);margin-top:6px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--panel2);display:inline-block;vertical-align:middle}
.messages{display:grid;grid-template-columns:200px 1fr;gap:10px}
.conv{padding:6px;border-radius:6px;cursor:pointer}.conv:hover,.conv.on{background:var(--panel2)}
.chat-body{height:50vh;overflow:auto;padding:6px 0}
.msg{max-width:75%;margin:4px 0;padding:6px 10px;border-radius:10px;background:var(--panel2);display:inline-block;float:right;clear:both}
.msg.mine{background:var(--accent);color:#fff;float:left}
.msg-wrap{overflow:hidden}
.notif{padding:7px;border-bottom:1px solid var(--border);cursor:pointer}.notif.un{background:rgba(59,130,246,.08)}
.tabs{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.stat{background:var(--panel2);padding:9px;border-radius:7px}.stat b{font-size:19px}
@media(max-width:640px){.messages{grid-template-columns:1fr}.conv-list{max-height:170px;overflow:auto}}
</style>
</head>
<body>
<nav id="nav" class="hidden">
  <span class="brand">WoodNet</span>
  <button data-page="feed">الرئيسية</button>
  <button data-page="friends">الأصدقاء</button>
  <button data-page="messages">الرسائل</button>
  <button data-page="notifications">الإشعارات</button>
  <button data-page="admin">الإدارة</button>
  <button id="logout">خروج</button>
  <span class="muted small" id="who" style="margin-right:auto"></span>
</nav>
<main>
  <section id="page-auth"><div class="card" id="auth-card"></div></section>
  <section id="page-feed" class="hidden"></section>
  <section id="page-friends" class="hidden"></section>
  <section id="page-messages" class="hidden"></section>
  <section id="page-notifications" class="hidden"></section>
  <section id="page-admin" class="hidden"></section>
  <section id="page-profile" class="hidden"></section>
</main>
<script src="/app.js?v=10"></script>
</body>
</html>
