    function formatSeconds(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(sec % 60).padStart(2, '0');
      return `${m}:${s}`;
    }

    function getCurrentTimeString() {
      const d = new Date();
      let hrs = d.getHours();
      const mins = String(d.getMinutes()).padStart(2, '0');
      const ampm = hrs >= 12 ? 'م' : 'ص';
      hrs = hrs % 12 || 12;
      return `${hrs}:${mins} ${ampm}`;
    }

    function toast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.innerHTML = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function playTone(type) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        window._actx = window._actx || new AudioCtx();
        const osc = window._actx.createOscillator();
        const gain = window._actx.createGain();
        osc.connect(gain);
        gain.connect(window._actx.destination);

        if (type === 'dial') {
          osc.frequency.setValueAtTime(620, window._actx.currentTime);
          gain.gain.setValueAtTime(0.04, window._actx.currentTime);
          osc.start();
          osc.stop(window._actx.currentTime + 0.1);
        } else if (type === 'ring') {
          osc.frequency.setValueAtTime(480, window._actx.currentTime);
          gain.gain.setValueAtTime(0.06, window._actx.currentTime);
          osc.start();
          osc.stop(window._actx.currentTime + 0.4);
        } else if (type === 'msg') {
          osc.frequency.setValueAtTime(880, window._actx.currentTime);
          gain.gain.setValueAtTime(0.05, window._actx.currentTime);
          osc.start();
          osc.stop(window._actx.currentTime + 0.08);
        }
      } catch (e) {}
    }

    function toggleDarkMode() {

      const isDark = document.body.classList.contains('dark-mode');
      const icon = document.getElementById('darkModeIcon');
      const btn = document.getElementById('darkModeBtn');
      
      if (isDark) {
        icon.className = 'fa-solid fa-sun text-[15px] text-amber';
        btn.title = 'إيقاف الوضع الليلي';
        localStorage.setItem('axisup_theme', 'dark');

    }

    function loadSavedTheme() {

    }

        renderApp();

    function startGroupVideoCall() {
      playTone('ring');
      state.activeCall = {
        userId: null,
        name: 'مؤتمر فيديو جماعي · فريق التصميم والتطوير',
        avatar: ASSETS.postImg2,
        phone: 'غرفة مشفرة #402',
        type: 'video',
        status: 'active',
        duration: 0,
        muted: false,
        videoEnabled: true,
        screenSharing: false,
        isGroup: true,
        participants: [1, 2, 3, 5]
      };
      startCallTimer();
      renderApp();
      toast('بدأت المكالمة الجماعية مع 4 أعضاء 👥');
    }

    function startKeypadCall(type) {
      if (!state.dialNumber) {
        toast('يرجى إدخال رقم هاتف للاتصال 📞');
        return;
      }
      playTone('ring');
      state.activeCall = {
        userId: null,
        name: state.dialNumber,
        avatar: ASSETS.ahmed,
        phone: state.dialNumber,
        type: type,
        status: 'ringing',
        duration: 0,
        muted: false,
        videoEnabled: type === 'video',
        screenSharing: false,
        isGroup: false
      };
      renderApp();

      setTimeout(() => {
        if (state.activeCall && state.activeCall.status === 'ringing') {
          state.activeCall.status = 'active';
          startCallTimer();
          renderApp();
        }
      }, 1900);
    }

    function startCallTimer() {
      clearInterval(callTimerInterval);
      callTimerInterval = setInterval(() => {
        if (!state.activeCall || state.activeCall.status !== 'active') return;
        state.activeCall.duration++;
        const el = document.getElementById('liveCallDuration');
        if (el) el.textContent = formatSeconds(state.activeCall.duration);
      }, 1000);
    }

    function endActiveCall() {
      clearInterval(callTimerInterval);
      if (state.activeCall) {
        CALL_LOGS.unshift({
          id: Date.now(),
          userId: state.activeCall.userId || 1,
          type: state.activeCall.type,
          direction: 'out',
          status: 'connected',
          time: 'الآن',
          duration: formatSeconds(state.activeCall.duration || 0)
        });
        toast(`انتهت المكالمة (${formatSeconds(state.activeCall.duration)})`);
      }
      state.activeCall = null;
      renderApp();
    }

    function toggleCallMute() {
      if (!state.activeCall) return;
      state.activeCall.muted = !state.activeCall.muted;
      renderApp();
      toast(state.activeCall.muted ? 'تم كتم الصوت 🔇' : 'تم تشغيل الميكروفون 🎙');

    function toggleCallVideo() {
      if (!state.activeCall) return;
      state.activeCall.videoEnabled = !state.activeCall.videoEnabled;
      renderApp();
      toast(state.activeCall.videoEnabled ? 'تم تشغيل الكاميرا 📹' : 'تم إيقاف الكاميرا');

    function toggleScreenShare() {

    function renderKeypadDialer() {
      const keys = [

      return `
        <div class="max-w-sm mx-auto">

          </div>

          <div class="grid grid-cols-3 gap-3 mt-5">
            ${keys.map(([digit, sub]) => `
              <button onclick="pressKeypad('${digit}')" class="key-btn">
                <span>${digit}</span>

              </button>

          </div>

          <div class="mt-6 flex items-center justify-center gap-4">
            <button onclick="deleteKeypad()" class="w-12 h-12 rounded-full bg-ink/5 hover:bg-ink/10 flex items-center justify-center text-ink/70 text-lg transition">
              <i class="fa-solid fa-delete-left"></i>
            </button>
            <button onclick="startKeypadCall('voice')" class="w-16 h-16 rounded-full bg-brand-green hover:bg-brand-hover text-white flex items-center justify-center text-2xl shadow-glow transition">
              <i class="fa-solid fa-phone"></i>

      `;
    }

              <i class="fa-solid fa-chevron-down"></i>
            </button>
            <div class="text-center">
              <div class="flex items-center justify-center gap-1.5 text-brand-green text-[12px] font-extrabold">
                <i class="fa-solid fa-lock text-[10px]"></i> مشفر بالكامل · Axis Up HD
              </div>
              <div id="liveCallDuration" class="text-[13px] font-mono text-white/70 mt-0.5">
                ${isRinging ? 'جارٍ الاتصال...' : formatSeconds(call.duration)}
              </div>
            </div>
            <button onclick="toast('إضافة طرف ثالث للمكالمة ➕')" class="w-10 h-10 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition">
              <i class="fa-solid fa-user-plus"></i>
            </button>
          </div>

          <!-- Call Center Canvas -->
          <div class="relative z-10 flex-1 flex items-center justify-center my-4 overflow-hidden">
            ${call.type === 'video' ? `
              ${call.isGroup ? `
                <!-- 4-Grid Group Video -->
                <div class="grid grid-cols-2 gap-3 w-full max-w-3xl h-[420px]">
                  ${call.participants.map((pid, idx) => {
                    const u = getUser(pid);
                    const mockImgs = [ASSETS.postImg1, ASSETS.postImg2, ASSETS.postImg3, ASSETS.postImg4];
                    return `
                      <div class="relative rounded-2xl overflow-hidden bg-ink/80 border border-white/10 flex items-center justify-center">
                        <img src="${mockImgs[idx % 4]}" class="w-full h-full object-cover" alt="" />
                        <div class="absolute bottom-2 right-2 px-2.5 py-1 rounded-lg bg-black/60 backdrop-blur text-[11px] font-bold flex items-center gap-1.5">
                          <img src="${u.avatar}" class="w-4 h-4 rounded-full object-cover" alt="" />
                          <span>${u.name}</span>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              ` : `
                <!-- 1 on 1 Video -->
                <div class="relative w-full max-w-2xl h-[420px] rounded-3xl overflow-hidden bg-black/60 border border-white/15 shadow-2xl">
                  ${call.videoEnabled ? `
                    <img src="${ASSETS.postImg1}" class="w-full h-full object-cover" alt="فيديو المتصل" />
                  ` : `
                    <div class="w-full h-full flex flex-col items-center justify-center bg-deep">
                      <img src="${call.avatar}" class="w-24 h-24 rounded-full object-cover ring-4 ring-white/20 mb-3" alt="" />
                      <span class="text-white/60 text-[13px]">الكاميرا مغلقة من الطرف الآخر</span>
                    </div>
                  `}
                  <!-- Self PiP -->
                  <div class="absolute bottom-4 left-4 w-28 h-36 rounded-2xl overflow-hidden border-2 border-white shadow-xl bg-ink">
                    <img src="${CURRENT_USER.avatar}" class="w-full h-full object-cover" alt="" />
                    <span class="absolute bottom-1 right-1 px-1.5 py-0.5 rounded bg-black/70 text-[9px]">أنت</span>
                  </div>
                  <div class="absolute top-4 right-4 px-3 py-1.5 rounded-xl bg-black/50 backdrop-blur text-[12px] font-bold">
                    ${call.name} · HD 1080p
                  </div>
                </div>
              `}
            ` : `
              <!-- Voice Call Stage -->
              <div class="text-center">
                <div class="relative inline-block ${isRinging ? 'pulse-ring' : ''}">
                  <img src="${call.avatar}" class="w-32 h-32 rounded-full object-cover ring-4 ring-brand-green shadow-glow" alt="" />
                </div>
                <h3 class="display-font text-[24px] font-black mt-4">${call.name}</h3>
                <span class="text-[13px] text-white/60 block mt-1 font-mono" dir="ltr">${call.phone}</span>
                ${!isRinging ? `
                  <div class="flex items-end justify-center gap-1.5 h-10 mt-6">
                    <span class="w-1.5 h-4 bg-brand-green rounded-full audio-bar" style="animation-delay: 0.1s"></span>
                    <span class="w-1.5 h-8 bg-brand-green rounded-full audio-bar" style="animation-delay: 0.3s"></span>
                    <span class="w-1.5 h-10 bg-brand-green rounded-full audio-bar" style="animation-delay: 0.2s"></span>
                    <span class="w-1.5 h-6 bg-brand-green rounded-full audio-bar" style="animation-delay: 0.4s"></span>
                    <span class="w-1.5 h-9 bg-brand-green rounded-full audio-bar" style="animation-delay: 0.15s"></span>
                  </div>
                ` : ''}
              </div>
            `}
          </div>

          <!-- Bottom Call Controls -->
          <div class="relative z-10 max-w-md mx-auto w-full bg-white/10 backdrop-blur-xl rounded-3xl p-4 border border-white/15">
            <div class="flex items-center justify-around">
              <button onclick="toggleCallMute()" class="w-12 h-12 rounded-2xl flex items-center justify-center transition ${call.muted ? 'bg-coral text-white' : 'bg-white/15 hover:bg-white/25 text-white'}">
                <i class="fa-solid ${call.muted ? 'fa-microphone-slash' : 'fa-microphone'} text-[16px]"></i>
              </button>
              <button onclick="toggleCallVideo()" class="w-12 h-12 rounded-2xl flex items-center justify-center transition ${!call.videoEnabled ? 'bg-white/10 text-white/50' : 'bg-white/15 hover:bg-white/25 text-white'}">
                <i class="fa-solid ${call.videoEnabled ? 'fa-video' : 'fa-video-slash'} text-[16px]"></i>
              </button>
              <button onclick="endActiveCall()" class="w-16 h-16 rounded-full bg-coral hover:bg-red-600 text-white flex items-center justify-center text-2xl shadow-xl transition transform hover:scale-105">
                <i class="fa-solid fa-phone-slash"></i>
              </button>
              <button onclick="toggleScreenShare()" class="w-12 h-12 rounded-2xl flex items-center justify-center transition ${call.screenSharing ? 'bg-brand-green text-white' : 'bg-white/15 hover:bg-white/25 text-white'}">
                <i class="fa-solid fa-display text-[16px]"></i>
              </button>
              <button onclick="toast('يمكنك فتح نافذة محادثة سريعة أثناء المكالمة 💬')" class="w-12 h-12 rounded-2xl bg-white/15 hover:bg-white/25 text-white flex items-center justify-center transition">
                <i class="fa-solid fa-comment-dots text-[16px]"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    function renderIncomingCallModal() {
      const inc = state.incomingCall;
      if (!inc) return '';
      return `
        <div class="fixed inset-0 z-[160] bg-black/80 backdrop-blur-md flex items-center justify-center p-4 fade-scale">
          <div class="bg-ink text-white rounded-3xl border border-white/20 p-6 max-w-sm w-full text-center shadow-2xl relative overflow-hidden">
            <div class="absolute -top-12 -left-12 w-32 h-32 rounded-full bg-brand-green/30 blur-2xl"></div>
            <div class="pulse-ring inline-block mb-3">
              <img src="${inc.avatar}" class="w-20 h-20 rounded-full object-cover ring-4 ring-brand-green" alt="" />
            </div>
            <h4 class="display-font text-[20px] font-black">${inc.name}</h4>
            <span class="text-[12px] text-white/60 block mt-0.5">مكالمة ${inc.type === 'video' ? 'فيديو HD' : 'صوتية'} واردة عبر Axis Up</span>
            <div class="flex items-center justify-center gap-6 mt-8">
              <button onclick="rejectIncomingCall()" class="w-14 h-14 rounded-full bg-coral hover:bg-red-600 text-white flex items-center justify-center text-xl transition">
                <i class="fa-solid fa-phone-slash"></i>
              </button>
              <button onclick="answerIncomingCall()" class="w-14 h-14 rounded-full bg-brand-green hover:bg-brand-hover text-white flex items-center justify-center text-xl shadow-glow transition animate-pulse">
                <i class="fa-solid fa-phone"></i>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    /* -------------------------------------------------------------
       9. MOBILE SHELL & MOBILE CONTENT
    ------------------------------------------------------------- */
    function renderMobileContent() {
      if (state.mobileChatOpen) {
        const activeChat = CHATS.find(c => c.id === state.activeChatId) || CHATS[0];
        const partner = getUser(activeChat.userId);
        return `
          <div class="h-full flex flex-col -m-3 bg-white">
            <div class="p-3 bg-white border-b border-ink/8 flex items-center justify-between shrink-0">
              <div class="flex items-center gap-2">
                <button onclick="state.mobileChatOpen=false; renderApp();" class="w-8 h-8 rounded-xl bg-ink/5 flex items-center justify-center text-xs">
                  <i class="fa-solid fa-arrow-right"></i>
                </button>
                <img src="${partner.avatar}" class="w-9 h-9 rounded-full object-cover" alt="" />
                <div>
                  <h4 class="font-extrabold text-[13px] text-ink">${partner.name}</h4>
                  <span class="text-[10px] text-brand-deep font-bold">متصل الآن</span>
                </div>
              </div>
              <div class="flex items-center gap-1">
                <button onclick="startDirectCall(${partner.id}, 'voice')" class="w-8 h-8 rounded-xl bg-ink/5 text-ink/70 flex items-center justify-center text-xs"><i class="fa-solid fa-phone"></i></button>
                <button onclick="startDirectCall(${partner.id}, 'video')" class="w-8 h-8 rounded-xl bg-brand-green text-white flex items-center justify-center text-xs shadow-sm"><i class="fa-solid fa-video"></i></button>
              </div>
            </div>
            <div class="flex-1 p-3 overflow-y-auto nice-scroll space-y-2.5 bg-[#F8FAFC]">
              ${activeChat.messages.map(m => `
                <div class="flex ${m.from === 'me' ? 'justify-start' : 'justify-end'}">
                  <div class="bubble ${m.from === 'me' ? 'me' : 'them'} text-[12px] py-2 px-3">
                    <p>${m.text}</p>
                    <span class="block text-[9px] mt-1 text-left ${m.from === 'me' ? 'text-white/75' : 'text-ink/40'}">${m.time}</span>
                  </div>
                </div>
              `).join('')}
            </div>
            <div class="p-2.5 bg-white border-t border-ink/8 flex items-center gap-1.5 shrink-0">
              <input id="activeChatInput" onkeydown="if(event.key==='Enter')sendChatMessage()" placeholder="رسالة..." class="flex-1 bg-ink/5 rounded-full px-3 py-2 text-[12px] outline-none" />
              <button onclick="sendChatMessage()" class="w-8 h-8 rounded-full bg-brand-green text-white flex items-center justify-center text-xs">
                <i class="fa-solid fa-paper-plane"></i>
              </button>
            </div>
          </div>
        `;
      }

      if (state.activeView === 'feed') {
        return `
          <div class="space-y-3">
            ${renderStoriesBar(true)}
            ${renderPostComposer()}
            ${POSTS.map(p => renderPostCard(p)).join('')}
          </div>
        `;
      }
      if (state.activeView === 'chat') {
        return `
          <div class="space-y-2">
            <h4 class="font-extrabold text-[15px] text-ink px-1">المحادثات المباشرة</h4>
            ${CHATS.map(chat => {
              const u = getUser(chat.userId);
              const last = chat.messages[chat.messages.length - 1] || { text: '' };
              return `
                <div onclick="openChatRoom(${chat.id})" class="p-3 rounded-2xl bg-white border border-ink/8 flex items-center gap-3 cursor-pointer">
                  <div class="relative shrink-0">
                    <img src="${u.avatar}" class="w-11 h-11 rounded-full object-cover" alt="" />
                    ${u.online ? '<span class="absolute bottom-0 left-0 w-2.5 h-2.5 rounded-full bg-brand-green ring-2 ring-white"></span>' : ''}
                  </div>
                  <div class="min-w-0 flex-1">
                    <div class="flex items-center justify-between">
                      <h4 class="font-extrabold text-[13px] text-ink">${u.name}</h4>
                      <span class="text-[10px] text-ink/40">${last.time || ''}</span>
                    </div>
                    <p class="text-[11.5px] text-ink/60 truncate mt-0.5">${last.text}</p>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
      if (state.activeView === 'calls') return renderCallsView();
      if (state.activeView === 'friends') return renderFriendsView();
      if (state.activeView === 'groups') return renderGroupsView();
      if (state.activeView === 'profile') return renderProfileView();
      return renderFeedView();
    }

    function renderMobileShell() {
      return `
        <div class="pt-20 pb-12 min-h-screen grid-bg">
          <div class="max-w-6xl mx-auto px-4 grid lg:grid-cols-12 gap-8 items-center">
            
            <!-- Left Info Banner -->
            <div class="lg:col-span-6 text-center lg:text-right space-y-4">
              <span class="px-3.5 py-1.5 rounded-full bg-brand-soft text-brand-deep font-extrabold text-[12px] inline-block border border-brand-green/20">
                <i class="fa-solid fa-mobile-screen ml-1"></i> تجربة الهاتف المحمول الحية
              </span>
              <h2 class="display-font text-[30px] sm:text-[38px] font-black text-ink leading-tight">
                المنصة المتكاملة <br /><span class="text-brand-green">في راحة يدك</span>
              </h2>
              <p class="text-[14px] text-ink/70 leading-[1.8]">
                استمتع بنفس الميزات الموحدة: تصفح المنشورات والقصص، الدردشة الفورية، وإجراء مكالمات صوت وفيديو HD بنمط Axis Up مع لوحة اتصال مدمجة.
              </p>
              <div class="pt-2 flex flex-wrap items-center justify-center lg:justify-start gap-3">
                <button onclick="setAppMode('web')" class="px-5 py-2.5 rounded-xl bg-ink text-white font-bold text-[12.5px] hover:bg-deep transition flex items-center gap-2">
                  <i class="fa-solid fa-desktop"></i> الرجوع لواجهة الويب
                </button>
                <button onclick="triggerIncomingCallSimulation()" class="px-5 py-2.5 rounded-xl bg-brand-green text-white font-bold text-[12.5px] hover:bg-brand-hover shadow-glow transition flex items-center gap-2">
                  <i class="fa-solid fa-phone-volume"></i> استقبال مكالمة واردة
                </button>
              </div>
            </div>

            <!-- Phone Frame -->
            <div class="lg:col-span-6 flex justify-center">
              <div class="phone-mockup w-[350px] sm:w-[370px]">
                <div class="phone-screen h-[700px] flex flex-col">
                  <!-- Island -->
                  <div class="phone-island"></div>

                  <!-- Status bar -->
                  <div class="pt-7 px-6 pb-2 flex items-center justify-between text-[11px] font-bold text-ink shrink-0 bg-white">
                    <span>${getCurrentTimeString().split(' ')[0]}</span>
                    <div class="flex items-center gap-1.5 text-ink/70 text-[10px]">
                      <i class="fa-solid fa-signal"></i>
                      <i class="fa-solid fa-wifi"></i>
                      <i class="fa-solid fa-battery-full"></i>
                    </div>
                  </div>

                  <!-- Mobile App Header -->
                  <div class="px-4 py-2.5 bg-white border-b border-ink/8 flex items-center justify-between shrink-0">
                    <div class="flex items-center gap-2">
                      <span class="w-8 h-8 rounded-xl bg-ink text-brand-green flex items-center justify-center text-[13px]">
                        <i class="fa-solid fa-bolt"></i>
                      </span>
                      <span class="font-black text-[16px] text-ink">Axis<span class="text-brand-green">Up</span></span>
                    </div>
                    <div class="flex items-center gap-2">
                      <button onclick="switchView('calls'); setCallsTab('dial');" class="w-8 h-8 rounded-xl bg-brand-soft text-brand-deep flex items-center justify-center text-[12px]">
                        <i class="fa-solid fa-phone"></i>
                      </button>
                      <button onclick="switchView('profile')" class="w-8 h-8 rounded-xl overflow-hidden ring-2 ring-brand-green/30">
                        <img src="${CURRENT_USER.avatar}" class="w-full h-full object-cover" alt="" />
                      </button>
                    </div>
                  </div>

                  <!-- Mobile Scrollable Screen -->
                  <div class="flex-1 overflow-y-auto nice-scroll p-3 space-y-3 bg-[#F0F2F5]">
                    ${renderMobileContent()}
                  </div>

                  <!-- Mobile Bottom Tabs -->
                  <div class="bg-white border-t border-ink/8 px-2 py-2 flex items-center justify-around shrink-0">
                    <button onclick="switchView('feed')" class="flex flex-col items-center gap-1 text-[10px] font-bold ${state.activeView === 'feed' ? 'text-brand-deep' : 'text-ink/40'}">
                      <i class="fa-solid fa-house text-[15px]"></i>
                      <span>الموجز</span>
                    </button>
                    <button onclick="switchView('chat')" class="flex flex-col items-center gap-1 text-[10px] font-bold ${state.activeView === 'chat' ? 'text-brand-deep' : 'text-ink/40'} relative">
                      <i class="fa-solid fa-comments text-[15px]"></i>
                      <span>الدردشة</span>
                      <span class="absolute -top-1 right-2 w-3.5 h-3.5 rounded-full bg-brand-green text-white text-[8px] flex items-center justify-center">4</span>
                    </button>
                    <button onclick="switchView('calls')" class="flex flex-col items-center gap-1 text-[10px] font-bold ${state.activeView === 'calls' ? 'text-brand-deep' : 'text-ink/40'}">
                      <i class="fa-solid fa-phone-volume text-[15px]"></i>
                      <span>مكالمات HD</span>
                    </button>
                    <button onclick="switchView('friends')" class="flex flex-col items-center gap-1 text-[10px] font-bold ${state.activeView === 'friends' ? 'text-brand-deep' : 'text-ink/40'}">
                      <i class="fa-solid fa-user-group text-[15px]"></i>
                      <span>الأصدقاء</span>
                    </button>
                    <button onclick="switchView('profile')" class="flex flex-col items-center gap-1 text-[10px] font-bold ${state.activeView === 'profile' ? 'text-brand-deep' : 'text-ink/40'}">
                      <i class="fa-solid fa-user text-[15px]"></i>
                      <span>حسابي</span>
                    </button>
                  </div>

                </div>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    /* -------------------------------------------------------------
       10. PRIMARY RENDER CONTROLLER
    ------------------------------------------------------------- */
    function renderApp() {
      const stage = document.getElementById('appStage');
      if (!stage) return;

      if (state.appMode === 'mobile') {
        stage.innerHTML = renderMobileShell();
      } else {
        // Desktop / Full Web Mode
        let mainContent = '';
        if (state.activeView === 'feed') mainContent = renderFeedView();
        else if (state.activeView === 'chat') mainContent = renderChatView();
        else if (state.activeView === 'calls') mainContent = renderCallsView();
        else if (state.activeView === 'friends') mainContent = renderFriendsView();
        else if (state.activeView === 'groups') mainContent = renderGroupsView();
        else if (state.activeView === 'profile') mainContent = renderProfileView();

        stage.innerHTML = `
          <div class="pt-20 pb-16 px-3 sm:px-6 mx-auto max-w-[1520px]">
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
              <!-- Left Nav Sidebar -->
              <aside class="hidden lg:block lg:col-span-3 sticky top-20">
                ${renderLeftSidebar()}
              </aside>

              <!-- Central Feed / Active View -->
              <section class="lg:col-span-6 min-w-0">
                ${mainContent}
              </section>

              <!-- Right Contacts Sidebar -->
              <aside class="hidden lg:block lg:col-span-3 sticky top-20">
                ${renderRightSidebar()}
              </aside>
            </div>
          </div>
        `;
      }

      // Overlays
      document.getElementById('activeCallContainer').innerHTML = renderCallOverlay();
      document.getElementById('incomingCallContainer').innerHTML = renderIncomingCallModal();

      renderDesktopDocks();
    }

      // Initial Launch
    document.addEventListener('DOMContentLoaded', () => {
      // ✅ استرجاع المنشورات المحفوظة قبل أول عرض
      try {
        const saved = localStorage.getItem('axisup_posts');
        if (saved) POSTS = JSON.parse(saved);
      } catch(e) { console.warn('تعذر استرجاع المنشورات'); }
      
      updateHeaderButtons();
      renderApp();
    });

    // ✅ دالة الحفظ التلقائي
    function saveState() {
      try {
        localStorage.setItem('axisup_posts', JSON.stringify(POSTS));
      } catch(e) { console.warn('تعذر الحفظ'); }
    }
  </script>
<script src="/axisup-bridge.js?v=100"></script>
</body>
</html>
